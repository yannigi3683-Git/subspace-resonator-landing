<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schedule mockup</title>
<link rel="stylesheet" href="out.css" />
</head>
<body class="bg-[#111] p-0">
<div id="root"></div>
<script>
const I = {
  pencil: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
  trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>',
  chevron: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0 mt-0.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  calendar: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4"/><path d="M3 10h18"/></svg>',
  shuffle: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l.6.8"/><path d="M22 18h-6.1c-1.3 0-2.6-.7-3.3-1.7l-.6-.8"/></svg>',
};

/* ───────────── HOST CONSOLE ───────────── */
function badge(onAir) {
  return onAir
    ? `<span class="font-mono text-[11px] tracking-widest px-3 min-h-[44px] border border-red-500 text-red-400 shrink-0 inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-red-500"></span>ON AIR</span>`
    : `<span class="font-mono text-[11px] tracking-widest px-3 min-h-[44px] border border-border text-muted-foreground shrink-0 inline-flex items-center">OFF AIR</span>`;
}
function consoleShell(inner, { onAir = false } = {}) {
  const tabs = ['broadcast', 'schedule', 'moderation'].map((t) =>
    `<span class="font-mono text-[11px] tracking-widest px-2 sm:px-5 min-h-[44px] inline-flex items-center justify-center ${t === 'schedule' ? 'bg-primary/20 text-foreground' : 'text-muted-foreground'}">${t.toUpperCase()}</span>`).join('');
  return `
  <main class="bg-background text-foreground px-4 py-8 max-w-2xl mx-auto min-h-full">
    <div class="flex items-start justify-between gap-4 mb-6">
      <div>
        <p class="font-mono text-[11px] tracking-[0.35em] text-muted-foreground mb-2">// SUBSPACE RADIO LIVE</p>
        <h1 class="font-display text-2xl text-white">HOST CONSOLE</h1>
      </div>
      ${badge(onAir)}
    </div>
    <nav class="grid grid-cols-3 w-full sm:flex sm:w-fit mb-6 border border-border">${tabs}</nav>
    ${inner}
  </main>`;
}
function field(label, value, { placeholder = '', hint = '' } = {}) {
  return `<label class="flex flex-col gap-1">
    <span class="font-mono text-[11px] tracking-widest text-muted-foreground">${label}</span>
    <span class="bg-transparent border border-border px-3 font-mono text-sm min-h-[44px] flex items-center ${value ? 'text-white' : 'text-muted-foreground/50'}">${value || placeholder}</span>
    ${hint ? `<span class="font-mono text-[10px] text-muted-foreground">${hint}</span>` : ''}
  </label>`;
}
function newShowForm(state) {
  const filled = state === 'filled';
  return `<div class="flex flex-col gap-3">
    <span class="font-mono text-[11px] tracking-widest text-white">NEW SHOW</span>
    ${field('TITLE', filled ? 'Goa Classics part 2' : '', { placeholder: 'Show title' })}
    ${field('STARTS', filled ? '06/12/2026, 21:30' : '', { placeholder: 'dd/mm/yyyy, --:--', hint: 'Your device time (Israel).' })}
    ${filled ? `
      <p class="font-mono text-xs text-white border-l-2 border-[#26C6DA] pl-3 py-1 leading-relaxed">
        Sun 6 Dec 2026, 21:30 Israel<br><span class="text-muted-foreground">19:30 UTC · in 12 days</span>
      </p>
      <p class="font-mono text-[11px] text-amber-400 flex gap-2 leading-relaxed">${I.warn}<span>Goa Classics 1998 starts 30 min before this. You can still add it.</span></p>` : ''}
    <button class="font-mono text-[11px] tracking-widest min-h-[44px] border inline-flex items-center justify-center gap-2 ${filled ? 'border-primary text-white bg-primary/20' : 'border-border text-muted-foreground/50'}">${I.calendar} ADD TO SCHEDULE</button>
  </div>`;
}
const SHOWS = [
  { dow: 'SUN', d: '29', m: 'NOV', title: 'Psy Night Vol. 7', il: '22:00', utc: '20:00', rel: 'in 5d 3h' },
  { dow: 'SUN', d: '6', m: 'DEC', title: 'Goa Classics 1998', il: '21:00', utc: '19:00', rel: 'in 12d 2h' },
  { dow: 'SAT', d: '19', m: 'DEC', title: 'Subspace Theory Live', il: '23:00', utc: '21:00', rel: 'in 25d 4h' },
];
function dateBlock(s) {
  return `<div class="w-14 shrink-0 text-center border-r border-border pr-3 flex flex-col justify-center">
    <p class="font-mono text-[10px] tracking-widest text-muted-foreground">${s.dow}</p>
    <p class="font-display text-xl text-white leading-tight">${s.d}</p>
    <p class="font-mono text-[10px] tracking-widest text-muted-foreground">${s.m}</p>
  </div>`;
}
function iconBtn(icon, label, cls = 'text-muted-foreground') {
  return `<span class="w-11 h-11 border border-border inline-flex items-center justify-center ${cls}" aria-label="${label}">${icon}</span>`;
}
function showRow(s, mode = 'view') {
  if (mode === 'edit') {
    return `<div class="border border-primary p-3 flex flex-col gap-3 bg-primary/5">
      <span class="font-mono text-[11px] tracking-widest text-white">EDITING</span>
      ${field('TITLE', s.title)}
      ${field('STARTS', '29/11/2026, 22:30', { hint: 'Your device time (Israel).' })}
      <p class="font-mono text-xs text-white border-l-2 border-[#26C6DA] pl-3 py-1 leading-relaxed">Sun 29 Nov 2026, 22:30 Israel<br><span class="text-muted-foreground">20:30 UTC · in 5d 3h</span></p>
      <div class="grid grid-cols-2 gap-2">
        <span class="font-mono text-[11px] tracking-widest min-h-[44px] border border-primary text-white bg-primary/20 inline-flex items-center justify-center">SAVE</span>
        <span class="font-mono text-[11px] tracking-widest min-h-[44px] border border-border text-muted-foreground inline-flex items-center justify-center">CANCEL</span>
      </div>
    </div>`;
  }
  const confirm = mode === 'confirm';
  const icons = confirm ? '' : `<div class="flex flex-col sm:flex-row gap-1 shrink-0 items-start">${iconBtn(I.pencil, 'Edit')}${iconBtn(I.trash, 'Delete')}</div>`;
  return `<div class="border ${confirm ? 'border-red-500/60 bg-red-500/[0.04]' : 'border-border'} p-3 flex flex-col gap-3">
    <div class="flex items-stretch gap-3">
      ${dateBlock(s)}
      <div class="flex-1 min-w-0 flex flex-col justify-center gap-0.5">
        <p class="font-mono text-sm text-white break-words line-clamp-2">${s.title}</p>
        <p class="font-mono text-[11px] text-muted-foreground"><span class="whitespace-nowrap">${s.il} Israel</span> · <span class="whitespace-nowrap">${s.utc} UTC</span></p>
        <p class="font-mono text-[11px] text-[#26C6DA]">${s.rel}</p>
      </div>
      ${icons}
    </div>
    ${confirm ? `<p class="font-mono text-[11px] text-red-400">Delete this show? Guests stop seeing it within a minute.</p>
    <div class="grid grid-cols-2 gap-2">
      <span class="font-mono text-[11px] tracking-widest min-h-[44px] border border-red-500 text-red-400 bg-red-500/10 inline-flex items-center justify-center">DELETE</span>
      <span class="font-mono text-[11px] tracking-widest min-h-[44px] border border-border text-muted-foreground inline-flex items-center justify-center">KEEP</span>
    </div>` : ''}
  </div>`;
}
function schedulePanel({ form = 'empty', modes = ['view', 'view', 'view'], error = false, hideForm = false } = {}) {
  return `<section class="section-border p-4 sm:p-6 flex flex-col gap-6">
    <p class="font-mono text-[11px] tracking-[0.35em] text-muted-foreground">// SCHEDULE</p>
    ${error ? `<p role="alert" class="font-mono text-xs text-red-400 border border-red-500/60 bg-red-500/10 p-3 flex gap-2 leading-relaxed">${I.warn}<span>Not deleted. The server refused the change: your host sign-in has expired. Reload the console and sign in again.</span></p>` : ''}
    ${hideForm ? '' : newShowForm(form)}
    <div class="flex flex-col gap-2 ${hideForm ? '' : 'pt-5 border-t border-border/50'}">
      <span class="font-mono text-[11px] tracking-widest text-white mb-1">UPCOMING (3)</span>
      ${SHOWS.map((s, i) => showRow(s, modes[i])).join('')}
      <span class="font-mono text-[11px] tracking-widest text-muted-foreground min-h-[44px] inline-flex items-center gap-2 mt-1">${I.chevron} PAST (2)</span>
    </div>
    <p class="font-mono text-[10px] text-muted-foreground leading-relaxed">Guests see changes on the standby screen within a minute, in their own time zone. The schedule never starts a broadcast: GO LIVE is still yours.</p>
  </section>`;
}

/* ───────────── GUEST STANDBY ───────────── */
const OFFLINE = '<p class="font-mono text-white/60 text-xs tracking-widest mb-10 [@media(max-height:500px)]:mb-4 inline-flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-white/50"></span>SIGNAL OFFLINE</p>';
const STANDBY = '<p class="font-mono text-[#26C6DA] text-xs tracking-widest mb-10 [@media(max-height:500px)]:mb-4 inline-flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-[#26C6DA]"></span>STANDING BY</p>';
function standbyShell(inner, status = OFFLINE) {
  return `<div class="min-h-full bg-[#05060f] radio-nebula relative overflow-x-hidden flex flex-col items-center justify-center px-6 py-10 [@media(max-height:500px)]:py-6 text-center">
    <div class="absolute inset-0 radio-stars pointer-events-none"></div>
    <div class="absolute inset-x-0 top-0 h-1/3 radio-aurora pointer-events-none"></div>
    <div class="absolute inset-x-0 bottom-0 h-[30%] radio-floor-glow pointer-events-none"></div>
    <div class="relative z-10 w-full max-w-sm flex flex-col items-center">
      <h1 class="font-display text-white text-2xl sm:text-3xl font-bold tracking-[0.2em] mb-2" style="text-shadow:0 0 24px rgba(38,198,218,0.5)">SUBSPACE RADIO</h1>
      ${status}
      ${inner}
      <a class="font-mono text-[#B388F0] text-sm underline underline-offset-4 tracking-wide min-h-[44px] inline-flex items-center mt-8 [@media(max-height:500px)]:mt-4">Browse the archive</a>
      <p class="font-mono text-white/55 text-[10px] mt-6 [@media(max-height:500px)]:mt-2 tracking-wide">Subspace Radio · Goa / Psychedelic Trance</p>
    </div>
  </div>`;
}
function laterList(rows) {
  return `<div class="w-full mt-8 [@media(max-height:500px)]:mt-4 text-left">
    <p class="font-mono text-[#26C6DA]/80 text-[10px] tracking-[0.3em] mb-2">LATER</p>
    ${rows.map(([when, title]) => `<div class="flex items-baseline justify-between gap-3 py-2 border-t border-white/10">
      <span class="font-mono text-white/80 text-xs truncate">${title}</span>
      <span class="font-mono text-white/50 text-[11px] tabular-nums shrink-0">${when}</span>
    </div>`).join('')}
  </div>`;
}
function countdownCard({ count, title, when }) {
  return `<div class="w-full border border-white/10 bg-white/[0.04] backdrop-blur px-5 py-6">
    <p class="font-mono text-[#26C6DA]/80 text-[10px] tracking-[0.3em] mb-3">NEXT TRANSMISSION</p>
    <p class="font-mono text-white text-4xl [@media(max-height:500px)]:text-3xl tabular-nums tracking-tight mb-4" style="text-shadow:0 0 18px rgba(123,47,190,0.6)">${count}</p>
    <p class="font-display text-white text-lg tracking-wide mb-1">${title}</p>
    <p class="font-mono text-white/70 text-xs">${when} <span class="text-white/60">· your time</span></p>
  </div>`;
}
const keepOpen = `<p class="font-mono text-white/60 text-[11px] leading-relaxed mt-8 [@media(max-height:500px)]:mt-4 max-w-[260px]">Keep this page open. It switches over by itself when the signal goes live.</p>`;
const countEl = (d, hms) => `${d}<span class="text-2xl text-white/60">d</span> ${hms}`;

const GUEST = {
  il: standbyShell(countdownCard({ count: countEl(5, '03:22:08'), title: 'PSY NIGHT VOL. 7', when: 'Sun 29 Nov, 22:00 GMT+2' })
      + laterList([['Sun 6 Dec, 21:00', 'Goa Classics 1998'], ['Sat 19 Dec, 23:00', 'Subspace Theory Live']]) + keepOpen),
  ny: standbyShell(countdownCard({ count: countEl(5, '03:22:08'), title: 'PSY NIGHT VOL. 7', when: 'Sun, Nov 29, 3:00 PM EST' })
      + laterList([['Sun, Dec 6, 2:00 PM', 'Goa Classics 1998'], ['Sat, Dec 19, 4:00 PM', 'Subspace Theory Live']]) + keepOpen),
  soon: standbyShell(`<div class="w-full border border-[#26C6DA]/40 bg-[#26C6DA]/[0.06] backdrop-blur px-5 py-6">
      <p class="font-mono text-[#26C6DA] text-[10px] tracking-[0.3em] mb-3 inline-flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-[#26C6DA]" style="box-shadow:0 0 10px #26C6DA"></span>STARTING SOON</p>
      <p class="font-display text-white text-lg tracking-wide mb-1">PSY NIGHT VOL. 7</p>
      <p class="font-mono text-white/60 text-xs">Scheduled for 22:00 GMT+2</p>
      <p class="font-mono text-white/60 text-[11px] mt-3 leading-relaxed">The host is setting up the signal.</p>
    </div>` + laterList([['Sun 6 Dec, 21:00', 'Goa Classics 1998'], ['Sat 19 Dec, 23:00', 'Subspace Theory Live']]) + keepOpen, STANDBY),
  tba: standbyShell(`<div class="w-full border border-white/10 bg-white/[0.04] backdrop-blur px-5 py-6">
      <p class="font-mono text-[#26C6DA]/80 text-[10px] tracking-[0.3em] mb-3">NEXT TRANSMISSION</p>
      <p class="font-display text-white text-2xl tracking-[0.2em]">TBA</p>
    </div>`),
  gate: `<div class="h-full bg-[#05060f] radio-nebula relative overflow-hidden flex flex-col items-center justify-center p-6">
      <div class="absolute inset-x-0 top-0 h-1/3 radio-aurora"></div>
      <div class="relative z-10 w-full flex flex-col items-center">
        <h1 class="font-display text-white text-2xl font-bold tracking-[0.2em] mb-1" style="text-shadow:0 0 24px rgba(38,198,218,0.5)">SUBSPACE RADIO</h1>
        <p class="font-mono text-[#26C6DA]/70 text-xs tracking-widest mb-8 uppercase">Choose your identity</p>
        <div class="grid grid-cols-4 gap-2 mb-8 w-full max-w-xs">
          ${['#26C6DA','#7B2FBE','#E91E63','#FFC107','#4CAF50','#FF7043','#5C6BC0','#EC407A'].map((c, i) => `<div class="flex flex-col items-center gap-1.5 p-2 min-h-[72px] rounded-xl border ${i === 1 ? 'border-white/40 bg-white/10' : 'border-white/5 bg-white/[0.03]'}"><span class="w-10 h-10 rounded-full" style="background:radial-gradient(circle at 35% 35%, ${c}, ${c}33)"></span></div>`).join('')}
        </div>
        <div class="w-full max-w-xs mb-6">
          <p class="font-mono text-white/40 text-[10px] uppercase tracking-widest mb-2">Your name</p>
          <div class="flex gap-2"><span class="flex-1 bg-white/[0.06] border border-white/10 text-white font-mono px-4 py-3 rounded-xl">Nebula Drifter</span><span class="w-12 flex items-center justify-center bg-white/[0.06] border border-white/10 text-white/40 rounded-xl">${I.shuffle}</span></div>
        </div>
        <span class="w-full max-w-xs py-4 font-display font-bold tracking-[0.25em] text-sm rounded-xl bg-[#7B2FBE] text-white text-center">TUNE IN</span>
      </div>
    </div>`,
};

const HOST = {
  overview: consoleShell(schedulePanel()),
  adding: consoleShell(schedulePanel({ form: 'filled' })),
  live: consoleShell(schedulePanel({ modes: ['edit', 'view', 'view'] }), { onAir: true }),
  confirm: consoleShell(schedulePanel({ modes: ['view', 'confirm', 'view'] })),
  error: consoleShell(schedulePanel({ error: true })),
};

const FRAMES = {
  H1: { who: 'host', w: 760, h: 1020, title: '1 · Open SCHEDULE', body: HOST.overview, note: 'Upcoming shows, soonest first. Pencil edits, bin deletes. Past shows fold away.' },
  H2: { who: 'host', w: 760, h: 1110, title: '2 · Add a show', body: HOST.adding, note: 'Type it in your own time. Before saving you see it back in Israel time and UTC, plus a heads-up if it is close to another show.' },
  H3: { who: 'host', w: 760, h: 1500, title: '3 · Edit while ON AIR', body: HOST.live, note: 'Safe mid-show from the same console tab: the broadcast panel stays running underneath. Adding works on air too.' },
  H4: { who: 'host', w: 390, h: 1400, title: '4 · Phone: delete takes two taps', body: HOST.confirm, note: 'First tap asks, second tap deletes. KEEP backs out.' },
  H5: { who: 'host', w: 390, h: 1400, title: '5 · Phone: if a change fails', body: HOST.error, note: 'Nothing fails silently. If the server refuses a change, it says so in red instead of pretending it worked.' },
  G1: { who: 'guest', w: 390, h: 844, title: '1 · Guest opens your link, off air (Israel)', body: GUEST.il, note: 'Countdown straight away, no name or sign-in first. Then the next two shows.' },
  G2: { who: 'guest', w: 390, h: 844, title: '2 · Same moment, guest in New York', body: GUEST.ny, note: 'Same countdown. Times in their zone and their phone language format.' },
  G3: { who: 'guest', w: 390, h: 844, title: '3 · You are 7 min late', body: GUEST.soon, note: 'At zero: STANDING BY / STARTING SOON for 30 min, then on to the next show. Known limit: end a show early and this shows for the rest of those 30 min.' },
  G4: { who: 'guest', w: 390, h: 844, title: '4 · You press GO LIVE', body: GUEST.gate, note: 'Within seconds the page switches to the existing entry screen by itself: avatar, name, TUNE IN. Unchanged.' },
  G5: { who: 'guest', w: 390, h: 844, title: '5 · Nothing scheduled', body: GUEST.tba, note: 'Next transmission TBA, plus the archive link.' },
  G6: { who: 'guest', w: 1280, h: 800, title: '6 · Desktop guest', body: GUEST.il, note: 'Same screen on a laptop.' },
};

const qs = new URLSearchParams(location.search); const only = qs.get('only'); if (only && qs.get('w')) { FRAMES[only] = { ...FRAMES[only], w: +qs.get('w'), h: +qs.get('h') }; }
const root = document.getElementById('root');
if (only) {
  const f = FRAMES[only];
  document.body.style.background = 'hsl(0 0% 1%)';
  root.innerHTML = `<div style="width:${f.w}px;${f.who === 'host' ? '' : `display:grid;grid-template-rows:minmax(${f.h}px,auto);`}overflow:hidden">${f.body}</div>`;
} else {
  const group = (who, heading, sub) => `<section class="mb-16">
    <h2 class="font-display text-3xl text-white mb-1">${heading}</h2>
    <p class="font-mono text-xs text-muted-foreground mb-6">${sub}</p>
    <div class="flex flex-wrap gap-8 items-start">
    ${Object.entries(FRAMES).filter(([, f]) => f.who === who && f.w <= 760).map(([, f]) => {
      const s = f.w > 400 ? 0.62 : 0.86;
      return `<figure style="width:${f.w * s}px">
        <figcaption class="font-mono text-[12px] text-white mb-1">${f.title}</figcaption>
        <p class="font-mono text-[11px] text-muted-foreground mb-3 leading-relaxed" style="min-height:3.2em">${f.note}</p>
        <div class="border border-white/20 overflow-hidden" style="width:${f.w * s + 2}px">
          <div style="zoom:${s};width:${f.w}px;${f.who === 'guest' ? `height:${f.h}px;` : ''}overflow:hidden">${f.body}</div>
        </div>
      </figure>`;
    }).join('')}
    </div></section>`;
  root.innerHTML = `<div class="p-10 max-w-[1800px]">
    <p class="font-mono text-[11px] tracking-[0.35em] text-muted-foreground mb-2">// MOCKUP · NOT BUILT · 2026-11-24</p>
    <h1 class="font-display text-4xl text-white mb-10">SCHEDULE: how it works</h1>
    ${group('host', 'You, the host', 'radio.html#admin · SCHEDULE tab')}
    ${group('guest', 'Your guests', 'subspaceresonator.com/radio while you are off air')}
  </div>`;
}
</script>
</body>
</html>
